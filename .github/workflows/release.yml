name: Release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }} release binary
    permissions:
      contents: write
    env:
      CARGO_TARGET_DIR: target
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive: hop-macos-x86_64.tar.gz
          - name: macOS aarch64
            os: macos-15
            target: aarch64-apple-darwin
            archive: hop-macos-aarch64.tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Test native targets
        run: cargo test --locked --all-targets --target "${{ matrix.target }}"

      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package Unix
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/hop" dist/hop
          tar -C dist -czf "${{ matrix.archive }}" hop

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "hop $GITHUB_REF_NAME" \
              || gh release view "$GITHUB_REF_NAME" >/dev/null
          fi
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.archive }}" --clobber
